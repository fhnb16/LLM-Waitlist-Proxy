[workspace]
resolver = "3"
members = ["crates/lmq-core", "crates/lmq-server", "crates/lmq-desktop"]
default-members = ["crates/lmq-core", "crates/lmq-server"]

[workspace.package]
version = "2.7.0"
edition = "2024"
license = "Apache-2.0"
authors = ["LMQ contributors"]

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
panic = "unwind"

[profile.dev.package."*"]
opt-level = 1
