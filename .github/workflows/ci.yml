name: CI

# Каждый push и PR: формат, clippy, тесты, сборки (установщик, он же в .zip и .rar, portable-zip, .deb).
# Есть сертификат в секретах — exe, установщик и деинсталлятор подписываются Authenticode (scripts/sign.ps1).
# Push в master с новой версией в Cargo.toml (или тег vX.Y.Z): ещё и релиз на GitHub — тег
# vX.Y.Z, сборки, подписи minisign (*.minisig) и SHA256SUMS.txt. По ним работает автообновление
# LMQ. Тег вручную ставить не нужно; если релиз этой версии уже есть, push его не трогает.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: Windows (LMQ.exe, lmq-server.exe, установщик)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --no-fail-fast
      - name: Release build
        run: cargo build --release --workspace
      # Подпись Authenticode (scripts/sign.ps1), если в секретах есть сертификат: WINDOWS_SIGN_PFX
      # (+ WINDOWS_SIGN_PFX_PASSWORD) или своя команда поставщика WINDOWS_SIGN_COMMAND (+ подготовка
      # WINDOWS_SIGN_SETUP). Без них — сборка без подписи с предупреждением.
      - name: Signing setup
        id: sign
        shell: pwsh
        env:
          LMQ_SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX }}
          LMQ_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
          LMQ_SIGN_SETUP: ${{ secrets.WINDOWS_SIGN_SETUP }}
        run: |
          if (-not $env:LMQ_SIGN_PFX -and -not $env:LMQ_SIGN_COMMAND) {
            Write-Output "::warning::Сертификат не задан (секрет WINDOWS_SIGN_PFX или WINDOWS_SIGN_COMMAND) — exe и установщик без подписи Authenticode"
            "enabled=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          # Подготовка поставщика: установить утилиту, войти в облако. Путь к утилите — в $env:GITHUB_PATH.
          if ($env:LMQ_SIGN_SETUP) { Invoke-Expression $env:LMQ_SIGN_SETUP }
          $script = (Resolve-Path scripts/sign.ps1).Path
          @{ bundle = @{ windows = @{ signCommand = @{ cmd = 'pwsh'; args = @('-NoProfile', '-NonInteractive', '-File', $script, '%1') } } } } |
            ConvertTo-Json -Depth 6 | Set-Content "$env:RUNNER_TEMP/tauri.sign.json" -Encoding utf8NoBOM
          "enabled=true" >> $env:GITHUB_OUTPUT
      - name: Installer (NSIS)
        shell: pwsh
        env:
          LMQ_SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX }}
          LMQ_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
          LMQ_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
          LMQ_SIGN_TIMESTAMP: ${{ vars.WINDOWS_SIGN_TIMESTAMP }}
        run: |
          cargo install tauri-cli --version "^2" --locked
          cd crates/lmq-desktop
          # С подписью Tauri подписывает LMQ.exe, плагины NSIS, деинсталлятор и сам установщик.
          $sign = @()
          if ('${{ steps.sign.outputs.enabled }}' -eq 'true') { $sign = @('--config', "$env:RUNNER_TEMP/tauri.sign.json") }
          cargo tauri build --bundles nsis @sign
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Exe для portable-zip. LMQ.exe тоже: Tauri подписывает копию внутри установщика, а файл в
      # target/release после сборки остаётся без подписи.
      - name: Sign portable exe
        if: steps.sign.outputs.enabled == 'true'
        shell: pwsh
        env:
          LMQ_SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX }}
          LMQ_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
          LMQ_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
          LMQ_SIGN_TIMESTAMP: ${{ vars.WINDOWS_SIGN_TIMESTAMP }}
        run: |
          foreach ($f in 'target/release/LMQ.exe', 'target/release/lmq-server.exe') {
            pwsh -NoProfile -File scripts/sign.ps1 $f
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check signatures
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $files = 'target/release/LMQ.exe', 'target/release/lmq-server.exe', "target/release/bundle/nsis/LMQ_${v}_x64-setup.exe"
          $rows = $files | ForEach-Object { $s = Get-AuthenticodeSignature $_; [pscustomobject]@{ File = Split-Path $_ -Leaf; Status = $s.Status; Signer = $s.SignerCertificate.Subject } }
          $rows | Format-Table -AutoSize | Out-String | Write-Output
          if ('${{ steps.sign.outputs.enabled }}' -eq 'true') {
            $bad = $rows | Where-Object { $_.Status -in 'NotSigned', 'HashMismatch', 'Incompatible' }
            if ($bad) { Write-Output "::error::Не подписаны: $($bad.File -join ', ')"; exit 1 }
          }
      - name: Collect
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force out, portable | Out-Null
          $setup = "target/release/bundle/nsis/LMQ_${v}_x64-setup.exe"
          Copy-Item $setup out/
          Copy-Item target/release/LMQ.exe, target/release/lmq-server.exe, README.md, LICENSE, config.example.yaml, docs/universalbot-lmq-integration.md portable/
          Compress-Archive -Path portable/* -DestinationPath "out/LMQ-$v-windows-x64-portable.zip"
          # Установщик ещё и в архивах: голый .exe из браузера SmartScreen и Defender встречают
          # строже. Имена не кончаются на -setup.exe, поэтому автообновление их не выбирает.
          Compress-Archive -Path $setup -DestinationPath "out/LMQ-$v-windows-x64-setup.zip"
          Get-ChildItem out
      - name: Installer in .rar
        shell: pwsh
        run: |
          # RAR создаёт только WinRAR (7-Zip умеет лишь распаковывать). Не вышло — релиз без .rar.
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $rar = "C:\Program Files\WinRAR\Rar.exe"
          if (-not (Test-Path $rar)) { choco install winrar -y --no-progress | Out-Null }
          if (-not (Test-Path $rar)) { Write-Output "::warning::WinRAR не установился — релиз без .rar"; exit 0 }
          & $rar a -ep1 -m5 -idq "out/LMQ-$v-windows-x64-setup.rar" "target/release/bundle/nsis/LMQ_${v}_x64-setup.exe"
          if ($LASTEXITCODE -ne 0) { Write-Output "::warning::Rar.exe завершился с кодом $LASTEXITCODE — релиз без .rar"; Remove-Item "out/*.rar" -ErrorAction SilentlyContinue; exit 0 }
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: lmq-windows-x64
          path: out/*
          if-no-files-found: error

  debian:
    name: Debian bookworm x64 (lmq-server, .deb)
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config curl ca-certificates git cmake
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p lmq-core -p lmq-server --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p lmq-core -p lmq-server --no-fail-fast
      - name: Release build
        run: cargo build --release -p lmq-server
      - name: Package (.deb)
        run: |
          cargo install cargo-deb --locked
          cargo deb -p lmq-server --no-build
      - name: Smoke test
        run: |
          ./target/release/lmq-server --version
          ./target/release/lmq-server --home /tmp/lmq check-config
      - name: Collect
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          mkdir -p out
          cp target/debian/*.deb out/
          tar -czf "out/lmq-server-$v-linux-x64.tar.gz" -C target/release lmq-server -C ../.. README.md LICENSE config.example.yaml
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: lmq-debian-x64
          path: out/*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: [windows, debian]
    runs-on: ubuntu-latest
    # Два push подряд с одной версией не должны выпускать релиз дважды.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          tag="v$v"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией $v в Cargo.toml"
            exit 1
          fi
          # Push в master без смены версии — релиз этой версии уже есть, новый не нужен.
          skip=false
          if [ "$GITHUB_REF_TYPE" = "branch" ] && gh release view "$tag" >/dev/null 2>&1; then
            echo "Релиз $tag уже опубликован — поднимите версию в Cargo.toml, чтобы выпустить новый."
            skip=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        if: steps.ver.outputs.skip != 'true'
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Sign (minisign)
        if: steps.ver.outputs.skip != 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::warning::Секрет MINISIGN_SECRET_KEY не задан: релиз без подписей, LMQ покажет только ссылку и не установит обновление сам"
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y minisign
          key="$RUNNER_TEMP/release.key"
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          for f in dist/*; do
            minisign -S -s "$key" -m "$f" -t "LMQ $TAG $(basename "$f")"
          done
          rm -f "$key"
          # Подписи должны проверяться ключом, вшитым в LMQ, — иначе автообновление их отвергнет.
          pk=$(sed -n 's/.*DEFAULT_UPDATES_PUBKEY: &str = "\(.*\)";/\1/p' crates/lmq-core/src/config/settings.rs)
          for f in dist/*; do
            case "$f" in *.minisig) continue;; esac
            minisign -V -P "$pk" -m "$f" -q
          done
          ls -l dist
      - name: Publish
        if: steps.ver.outputs.skip != 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease";; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Повторный запуск по тегу: заменить файлы.
            gh release upload "$TAG" dist/* --clobber
          else
            # Тега может не быть (push в master) — gh создаст его на этом коммите.
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "LMQ ${TAG#v}" --generate-notes $pre
          fi
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[].name)'
