name: CI

# Каждый push и PR: формат, clippy, тесты, сборки.
# Тег vX.Y.Z (X.Y.Z — версия из Cargo.toml): ещё и релиз на GitHub — сборки, подписи
# minisign (*.minisig) и SHA256SUMS.txt. По ним работает автообновление LMQ.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: Windows (LMQ.exe, lmq-server.exe, установщик)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --no-fail-fast
      - name: Release build
        run: cargo build --release --workspace
      - name: Installer (NSIS)
        run: |
          cargo install tauri-cli --version "^2" --locked
          cd crates/lmq-desktop
          cargo tauri build --bundles nsis
      - name: Collect
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force out, portable | Out-Null
          Copy-Item "target/release/bundle/nsis/LMQ_${v}_x64-setup.exe" out/
          Copy-Item target/release/LMQ.exe, target/release/lmq-server.exe, README.md, LICENSE, config.example.yaml, docs/universalbot-lmq-integration.md portable/
          Compress-Archive -Path portable/* -DestinationPath "out/LMQ-$v-windows-x64-portable.zip"
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: lmq-windows-x64
          path: out/*
          if-no-files-found: error

  debian:
    name: Debian bookworm x64 (lmq-server, .deb)
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config curl ca-certificates git cmake
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p lmq-core -p lmq-server --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p lmq-core -p lmq-server --no-fail-fast
      - name: Release build
        run: cargo build --release -p lmq-server
      - name: Package (.deb)
        run: |
          cargo install cargo-deb --locked
          cargo deb -p lmq-server --no-build
      - name: Smoke test
        run: |
          ./target/release/lmq-server --version
          ./target/release/lmq-server --home /tmp/lmq check-config
      - name: Collect
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          mkdir -p out
          cp target/debian/*.deb out/
          tar -czf "out/lmq-server-$v-linux-x64.tar.gz" -C target/release lmq-server -C ../.. README.md LICENSE config.example.yaml
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: lmq-debian-x64
          path: out/*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, debian]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией $v в Cargo.toml"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Sign (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::warning::Секрет MINISIGN_SECRET_KEY не задан: релиз без подписей, LMQ покажет только ссылку и не установит обновление сам"
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y minisign
          key="$RUNNER_TEMP/release.key"
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          for f in dist/*; do
            minisign -S -s "$key" -m "$f" -t "LMQ $GITHUB_REF_NAME $(basename "$f")"
          done
          rm -f "$key"
          # Подписи должны проверяться ключом, вшитым в LMQ, — иначе автообновление их отвергнет.
          pk=$(sed -n 's/.*DEFAULT_UPDATES_PUBKEY: &str = "\(.*\)";/\1/p' crates/lmq-core/src/config/settings.rs)
          for f in dist/*; do
            case "$f" in *.minisig) continue;; esac
            minisign -V -P "$pk" -m "$f" -q
          done
          ls -l dist
      - name: Publish
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "LMQ ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag $pre
          fi
