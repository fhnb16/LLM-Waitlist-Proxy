name: CI

# Каждый push и PR: формат, clippy, тесты, сборки (portable-zip, установщик, он же в .zip и .rar, .deb).
# Есть сертификат в секретах — exe, установщик и деинсталлятор подписываются Authenticode (scripts/sign.ps1).
#
# Проверки и сборки идут параллельно, на разных машинах. Push в master с новой версией в Cargo.toml
# (или тег vX.Y.Z) выпускает релиз vX.Y.Z по частям: каждая сборка выкладывается, как только готова
# и прошли её тесты (первая создаёт релиз), в конце пересчитывается SHA256SUMS.txt. Файлы подписаны
# minisign (*.minisig) — по ним работает автообновление; оно берёт только -setup.exe с подписью,
# поэтому релиз без установщика LMQ показывает ссылкой и сам не ставит.
# Тег вручную ставить не нужно. Релиз этой версии уже полный — push его не трогает; неполный
# (сборка упала) — push с исправлением доложит недостающее.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  version:
    name: Версия и релиз
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      publish: ${{ steps.ver.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          tag="v$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          publish=false
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && { [ "$GITHUB_REF" = "refs/heads/master" ] || [ "$GITHUB_REF_TYPE" = "tag" ]; }; then
            publish=true
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией $v в Cargo.toml"
            exit 1
          fi
          # Push в master без смены версии: полный релиз не трогаем, неполный докладываем.
          if [ "$publish" = true ] && [ "$GITHUB_REF_TYPE" = "branch" ] && names=$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null); then
            missing=""
            for f in "LMQ_${v}_x64-setup.exe" "LMQ-$v-windows-x64-portable.zip" "lmq_${v}-1_amd64.deb"; do
              grep -qxF "$f" <<<"$names" || missing="$missing $f"
            done
            if [ -z "$missing" ]; then
              echo "Релиз $tag уже опубликован — поднимите версию в Cargo.toml, чтобы выпустить новый."
              publish=false
            else
              echo "::notice::Релиз $tag неполный, не хватает:$missing — доложим"
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  windows-checks:
    name: Windows — fmt, clippy, тесты
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --no-fail-fast

  windows-portable:
    name: Windows — LMQ.exe, lmq-server.exe, portable-zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Release build
        run: cargo build --release --workspace
      # Подпись Authenticode (scripts/sign.ps1), если в секретах есть сертификат: WINDOWS_SIGN_PFX
      # (+ WINDOWS_SIGN_PFX_PASSWORD) или своя команда поставщика WINDOWS_SIGN_COMMAND (+ подготовка
      # WINDOWS_SIGN_SETUP). Без них — сборка без подписи с предупреждением.
      - name: Signing setup
        id: sign
        shell: pwsh
        env:
          LMQ_SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX }}
          LMQ_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
          LMQ_SIGN_SETUP: ${{ secrets.WINDOWS_SIGN_SETUP }}
        run: |
          if (-not $env:LMQ_SIGN_PFX -and -not $env:LMQ_SIGN_COMMAND) {
            Write-Output "::warning::Сертификат не задан (секрет WINDOWS_SIGN_PFX или WINDOWS_SIGN_COMMAND) — exe без подписи Authenticode"
            "enabled=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          # Подготовка поставщика: установить утилиту, войти в облако. Путь к утилите — в $env:GITHUB_PATH.
          if ($env:LMQ_SIGN_SETUP) { Invoke-Expression $env:LMQ_SIGN_SETUP }
          "enabled=true" >> $env:GITHUB_OUTPUT
      - name: Sign exe
        if: steps.sign.outputs.enabled == 'true'
        shell: pwsh
        env:
          LMQ_SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX }}
          LMQ_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
          LMQ_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
          LMQ_SIGN_TIMESTAMP: ${{ vars.WINDOWS_SIGN_TIMESTAMP }}
        run: |
          foreach ($f in 'target/release/LMQ.exe', 'target/release/lmq-server.exe') {
            pwsh -NoProfile -File scripts/sign.ps1 $f
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check signatures
        shell: pwsh
        run: |
          $rows = 'target/release/LMQ.exe', 'target/release/lmq-server.exe' | ForEach-Object { $s = Get-AuthenticodeSignature $_; [pscustomobject]@{ File = Split-Path $_ -Leaf; Status = $s.Status; Signer = $s.SignerCertificate.Subject } }
          $rows | Format-Table -AutoSize | Out-String | Write-Output
          if ('${{ steps.sign.outputs.enabled }}' -eq 'true') {
            $bad = $rows | Where-Object { $_.Status -in 'NotSigned', 'HashMismatch', 'Incompatible' }
            if ($bad) { Write-Output "::error::Не подписаны: $($bad.File -join ', ')"; exit 1 }
          }
      - name: Collect
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force out, portable | Out-Null
          Copy-Item target/release/LMQ.exe, target/release/lmq-server.exe, README.md, LICENSE, config.example.yaml, docs/universalbot-lmq-integration.md portable/
          Compress-Archive -Path portable/* -DestinationPath "out/LMQ-$v-windows-x64-portable.zip"
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: lmq-windows-portable
          path: out/*
          if-no-files-found: error

  windows-installer:
    name: Windows — установщик (NSIS, .zip, .rar)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Готовый бинарник tauri-cli вместо сборки из исходников; нет готового — cargo-binstall соберёт сам.
      - uses: cargo-bins/cargo-binstall@main
      - name: tauri-cli
        run: cargo binstall tauri-cli --version "^2" --no-confirm --locked
      - name: Signing setup
        id: sign
        shell: pwsh
        env:
          LMQ_SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX }}
          LMQ_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
          LMQ_SIGN_SETUP: ${{ secrets.WINDOWS_SIGN_SETUP }}
        run: |
          if (-not $env:LMQ_SIGN_PFX -and -not $env:LMQ_SIGN_COMMAND) {
            Write-Output "::warning::Сертификат не задан (секрет WINDOWS_SIGN_PFX или WINDOWS_SIGN_COMMAND) — установщик без подписи Authenticode"
            "enabled=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($env:LMQ_SIGN_SETUP) { Invoke-Expression $env:LMQ_SIGN_SETUP }
          $script = (Resolve-Path scripts/sign.ps1).Path
          @{ bundle = @{ windows = @{ signCommand = @{ cmd = 'pwsh'; args = @('-NoProfile', '-NonInteractive', '-File', $script, '%1') } } } } |
            ConvertTo-Json -Depth 6 | Set-Content "$env:RUNNER_TEMP/tauri.sign.json" -Encoding utf8NoBOM
          "enabled=true" >> $env:GITHUB_OUTPUT
      - name: Installer (NSIS)
        shell: pwsh
        env:
          LMQ_SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX }}
          LMQ_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
          LMQ_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
          LMQ_SIGN_TIMESTAMP: ${{ vars.WINDOWS_SIGN_TIMESTAMP }}
        run: |
          cd crates/lmq-desktop
          # С подписью Tauri подписывает LMQ.exe, плагины NSIS, деинсталлятор и сам установщик.
          $sign = @()
          if ('${{ steps.sign.outputs.enabled }}' -eq 'true') { $sign = @('--config', "$env:RUNNER_TEMP/tauri.sign.json") }
          cargo tauri build --bundles nsis @sign
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check signature
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $s = Get-AuthenticodeSignature "target/release/bundle/nsis/LMQ_${v}_x64-setup.exe"
          Write-Output "LMQ_${v}_x64-setup.exe: $($s.Status) $($s.SignerCertificate.Subject)"
          if ('${{ steps.sign.outputs.enabled }}' -eq 'true' -and $s.Status -in 'NotSigned', 'HashMismatch', 'Incompatible') {
            Write-Output "::error::Установщик не подписан"; exit 1
          }
      - name: Collect
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = "target/release/bundle/nsis/LMQ_${v}_x64-setup.exe"
          Copy-Item $setup out/
          # Установщик ещё и в архивах: голый .exe из браузера SmartScreen и Defender встречают
          # строже. Имена не кончаются на -setup.exe, поэтому автообновление их не выбирает.
          Compress-Archive -Path $setup -DestinationPath "out/LMQ-$v-windows-x64-setup.zip"
          Get-ChildItem out
      - name: Installer in .rar
        shell: pwsh
        run: |
          # RAR создаёт только WinRAR (7-Zip умеет лишь распаковывать). Не вышло — релиз без .rar.
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $rar = "C:\Program Files\WinRAR\Rar.exe"
          if (-not (Test-Path $rar)) { choco install winrar -y --no-progress | Out-Null }
          if (-not (Test-Path $rar)) { Write-Output "::warning::WinRAR не установился — релиз без .rar"; exit 0 }
          & $rar a -ep1 -m5 -idq "out/LMQ-$v-windows-x64-setup.rar" "target/release/bundle/nsis/LMQ_${v}_x64-setup.exe"
          if ($LASTEXITCODE -ne 0) { Write-Output "::warning::Rar.exe завершился с кодом $LASTEXITCODE — релиз без .rar"; Remove-Item "out/*.rar" -ErrorAction SilentlyContinue; exit 0 }
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: lmq-windows-installer
          path: out/*
          if-no-files-found: error

  debian:
    name: Debian bookworm x64 (lmq-server, .deb)
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config curl ca-certificates git cmake
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: cargo-deb
        run: cargo binstall cargo-deb --no-confirm --locked
      - name: Clippy
        run: cargo clippy -p lmq-core -p lmq-server --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p lmq-core -p lmq-server --no-fail-fast
      - name: Release build
        run: cargo build --release -p lmq-server
      - name: Package (.deb)
        run: cargo deb -p lmq-server --no-build
      - name: Smoke test
        run: |
          ./target/release/lmq-server --version
          ./target/release/lmq-server --home /tmp/lmq check-config
      - name: Collect
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          mkdir -p out
          cp target/debian/*.deb out/
          tar -czf "out/lmq-server-$v-linux-x64.tar.gz" -C target/release lmq-server -C ../.. README.md LICENSE config.example.yaml
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: lmq-debian-x64
          path: out/*
          if-no-files-found: error

  # Публикация: каждая сборка — сразу, как готова. Windows-сборки ждут ещё и своих тестов,
  # Debian проверяет себя сам.
  publish-portable:
    name: Релиз — portable-zip
    needs: [version, windows-checks, windows-portable]
    if: needs.version.outputs.publish == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      artifact: lmq-windows-portable
      tag: ${{ needs.version.outputs.tag }}
    secrets:
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}

  publish-installer:
    name: Релиз — установщик
    needs: [version, windows-checks, windows-installer]
    if: needs.version.outputs.publish == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      artifact: lmq-windows-installer
      tag: ${{ needs.version.outputs.tag }}
    secrets:
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}

  publish-debian:
    name: Релиз — Debian
    needs: [version, debian]
    if: needs.version.outputs.publish == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      artifact: lmq-debian-x64
      tag: ${{ needs.version.outputs.tag }}
    secrets:
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}

  # SHA256SUMS.txt — по всему, что успело попасть в релиз, даже если одна из сборок упала.
  checksums:
    name: Релиз — SHA256SUMS.txt
    needs: [version, publish-portable, publish-installer, publish-debian]
    if: always() && needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::Релиза $TAG нет — ни одна сборка не опубликована"
            exit 0
          fi
          gh release download "$TAG" -D assets
          rm -f assets/*.minisig assets/SHA256SUMS.txt
          mkdir -p sums
          (cd assets && sha256sum * > ../sums/SHA256SUMS.txt)
          cat sums/SHA256SUMS.txt
          bash scripts/release-publish.sh sums
